name: CI - Pipe Resume Protocol

on:
  pull_request:
    paths:
      - 'html/assets/js/pipe/app.js'
      - 'scripts/pipe-resume-latency.test.mjs'
      - 'scripts/pipe-resume-browser.mjs'
      - '.github/workflows/ci-pipe.yml'

permissions:
  contents: read

jobs:
  protocol:
    name: Pipe resume protocol
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Public, credential-free fetch avoids checkout's submodule-auth cleanup:
      # this repository contains unrelated worktree gitlinks without .gitmodules.
      - name: Checkout exact PR head with baseline history
        env:
          PIPE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          [[ "$PIPE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init
          git remote add origin https://github.com/afjk/afjk.jp.git
          git fetch --no-tags origin "$PIPE_HEAD_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$PIPE_HEAD_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          node --check html/assets/js/pipe/app.js
          node --check scripts/pipe-resume-latency.test.mjs
          node --check scripts/pipe-resume-browser.mjs
      - name: Test protocol and synthetic latency
        run: node --test scripts/pipe-resume-latency.test.mjs
