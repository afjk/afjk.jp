name: Deploy to Staging

on:
  push:
    branches:
      - main
      - codex/**
      - experiment/**
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: SSH and deploy to staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          timeout: 120s
          script: |
            set -e
            DEPLOY_BRANCH='${{ github.ref_name }}'
            cd ~/github/afjk.jp
            git fetch origin "+refs/heads/${DEPLOY_BRANCH}:refs/remotes/origin/${DEPLOY_BRANCH}"
            git checkout -B "${DEPLOY_BRANCH}" "refs/remotes/origin/${DEPLOY_BRANCH}"
            git reset --hard "refs/remotes/origin/${DEPLOY_BRANCH}"
            docker compose up -d --build presence-server
            docker compose up -d mediamtx
            docker compose -p afjkjp-staging -f docker-compose.staging.yml up -d --force-recreate
            # https-portal fronts production too. Reload nginx in place (which
            # re-resolves the recreated www-service-staging upstream) instead of
            # recreating the container: a recreate releases and rebinds 80/443,
            # and a failed rebind takes every afjk.jp domain offline.
            if [ "$(docker inspect -f '{{.State.Running}}' https-portal 2>/dev/null)" = "true" ]; then
              docker exec https-portal nginx -s reload
            else
              docker compose up -d https-portal
            fi
            sleep 3
            if [ "$(docker inspect -f '{{.State.Running}}' https-portal 2>/dev/null)" != "true" ]; then
              echo "::error::https-portal is not running; afjk.jp is offline"
              docker ps -a --filter name=https-portal
              docker ps --filter publish=80 --filter publish=443
              ss -ltn '( sport = :80 or sport = :443 )' || true
              docker logs --tail 50 https-portal || true
              exit 1
            fi
