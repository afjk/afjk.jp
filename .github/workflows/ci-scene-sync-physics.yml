name: CI - Scene Sync Physics

on:
  pull_request:
    paths:
      - "html/assets/js/scenesync/physics/**"
      - "html/assets/js/scenesync/scene-physics.js"
      - "html/assets/js/scenesync/scene-physics.test.js"
      - "html/assets/js/scenesync/shells/player/player-physics-drag-input.js"
      - "html/assets/js/scenesync/shells/player/player-physics-drag-input.test.js"
      - "html/assets/vendor/rapier/**"
      - "fixtures/rapier/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-scene-sync-physics.yml"
  push:
    branches:
      - main
    paths:
      - "html/assets/js/scenesync/physics/**"
      - "html/assets/js/scenesync/scene-physics.js"
      - "html/assets/js/scenesync/scene-physics.test.js"
      - "html/assets/js/scenesync/shells/player/player-physics-drag-input.js"
      - "html/assets/js/scenesync/shells/player/player-physics-drag-input.test.js"
      - "html/assets/vendor/rapier/**"
      - "fixtures/rapier/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-scene-sync-physics.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test Scene Sync Physics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check html/assets/js/scenesync/physics/index.js
          node --check html/assets/js/scenesync/physics/rapier-world.js
          node --check html/assets/js/scenesync/scene-physics.js

      - name: Run physics tests
        run: npm run test:physics
