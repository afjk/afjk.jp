name: CI - Scene Sync Export Viewer Smokes

on:
  pull_request:
    paths:
      - "html/assets/js/scenesync-export/export/**"
      - "html/assets/js/scenesync-export/viewer/**"
      - "html/assets/js/scenesync/handoff/**"
      - "html/assets/js/scenesync/importers/scene-sync-export/**"
      - "html/assets/js/scenesync/scene.js"
      - "html/scenesync/index.html"
      - "html/assets/js/scenesync/scene-physics.js"
      - "html/assets/js/scenesync/physics/**"
      - "html/assets/js/scenesync/plugins/scene-sync-physics-plugin.js"
      - "html/assets/js/scenesync/plugins/scene-sync-loomlet-plugin.js"
      - "html/assets/js/scenesync/runtime/**"
      - "html/assets/js/scenesync/shells/player/player-actions.js"
      - "html/assets/js/scenesync/shells/player/player-transport.js"
      - "html/assets/js/scenesync/shells/player/player-shell.css"
      - "apps/presence-server/**"
      - "docker-compose.yml"
      - "docs/scene-sync-open-handoff.md"
      - "html/assets/vendor/loomlet/**"
      - "html/assets/vendor/rapier-deterministic/**"
      - "scripts/scenesync-export-static-viewer-smoke.mjs"
      - "scripts/scenesync-export-single-html-smoke.mjs"
      - "scripts/scenesync-handoff-browser-e2e.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-scene-sync-export-static-viewer.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Static and Single HTML Viewer Smokes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Keep Playwright's install location aligned with the E2E scripts.
      PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install presence server dependencies
        run: npm ci --prefix apps/presence-server

      - name: Run export, import, and handoff unit suite
        run: npm run test:scene-sync-export-import

      - name: Run presence server-pull unit suite
        run: node --test apps/presence-server/tests/server-pull-import.test.mjs

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run static viewer smoke
        run: npm run test:e2e:scene-sync-export-static-viewer

      - name: Run Single HTML file playback smoke
        run: npm run test:e2e:scene-sync-export-single-html

      - name: Run Open in Scene Sync and token fallback E2E
        run: npm run test:e2e:scene-sync-token-handoff
