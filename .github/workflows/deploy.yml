name: Deploy Production

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-viewer-smoke:
    name: Static Viewer Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers

      - name: Run static viewer smoke
        run: npm run test:e2e:scene-sync-export-static-viewer

  deploy:
    needs: static-viewer-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: SSH and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          timeout: 120s
          script: |
            cd ~/github/afjk.jp
            git fetch origin
            git reset --hard origin/main
            docker compose up -d --force-recreate www-service
            docker compose up -d --build presence-server
            docker compose up -d mediamtx
            docker compose up -d --force-recreate https-portal
            docker compose up -d --force-recreate verdaccio
