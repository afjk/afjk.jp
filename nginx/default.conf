# Scene Sync loads unversioned ES modules, including lazy-loaded shells.
# Revalidate code and styles on subsequent loads instead of using stale shells.
# Leave GLB, videos, textures and other media on their existing cache policy.
map $uri $scene_sync_cache_control {
  default "";
  ~^/(scenesync|assets/js/scenesync)/.*\.(html|js|mjs|css)$ "no-cache";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header Cache-Control $scene_sync_cache_control always;

  # Serve static assets for afjk.jp and subpaths (including /pipe)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Some nginx mime maps do not include .mjs. Module scripts require a
  # JavaScript MIME type; otherwise browsers reject them before execution.
  location ~* \.mjs$ {
    types {
      application/javascript mjs;
    }
    default_type application/javascript;
    try_files $uri =404;
  }

  # WHIP/WHEP WebRTC endpoints for /pipe streaming.
  # Keep this here as a fallback even though production https-portal also
  # proxies /stream/, so requests never fall through to static file handling.
  location /stream/ {
    proxy_pass http://mediamtx:8889/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

}
