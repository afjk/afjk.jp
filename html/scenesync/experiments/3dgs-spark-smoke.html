<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SceneSync 3DGS KHR → Spark Smoke</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111; color: #fff; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #status { position: fixed; top: 12px; left: 12px; z-index: 2; padding: 8px 10px; border-radius: 6px; background: rgba(0,0,0,.65); font-size: 13px; white-space: pre-line; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="status">KHR_gaussian_splatting GLB → Spark 2.1.0\nloading…</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { SparkRenderer, SplatMesh } from '@sparkjsdev/spark';
    import { decodeGaussianSplatGlb } from '../../assets/js/scenesync/loaders/khr-gaussian-splatting.js';

    const status = document.querySelector('#status');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 1000);
    camera.position.set(0, 0.25, 2.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.2, 0);
    controls.enableDamping = true;

    const spark = new SparkRenderer({ renderer });
    scene.add(spark);

    async function loadFixture() {
      const response = await fetch('./fixtures/minimal-khr-gaussian-splatting.glb');
      if (!response.ok) throw new Error(`fixture HTTP ${response.status}`);
      const bytes = await response.arrayBuffer();
      const decoded = decodeGaussianSplatGlb(bytes);

      let totalSplats = 0;
      const meshes = decoded.primitives.map((primitive) => {
        totalSplats += primitive.splats.length;
        const mesh = new SplatMesh({
          constructSplats(packedSplats) {
            for (const splat of primitive.splats) {
              packedSplats.pushSplat(
                new THREE.Vector3(...splat.position),
                new THREE.Vector3(...splat.scale),
                new THREE.Quaternion(...splat.rotation),
                splat.opacity,
                new THREE.Color(...splat.color),
              );
            }
          },
        });
        scene.add(mesh);
        return mesh;
      });

      await Promise.all(meshes.map((mesh) => mesh.initialized));
      status.textContent = [
        'KHR_gaussian_splatting GLB → accessor decode → Spark: OK',
        `primitives: ${decoded.primitives.length}`,
        `splats: ${totalSplats}`,
        'Three.js r180 / Spark 2.1.0',
      ].join('\n');
    }

    loadFixture().catch((error) => {
      console.error(error);
      status.textContent = `KHR → Spark smoke: FAILED\n${error?.message || error}`;
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
