<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SceneSync 3DGS Spark Smoke</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111; color: #fff; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #status { position: fixed; top: 12px; left: 12px; z-index: 2; padding: 8px 10px; border-radius: 6px; background: rgba(0,0,0,.65); font-size: 13px; white-space: pre-line; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="status">Spark 2.1.0 / Three.js r180\nloading…</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { SparkRenderer, SplatMesh } from '@sparkjsdev/spark';

    const status = document.querySelector('#status');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 1000);
    camera.position.set(0, 0, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const spark = new SparkRenderer({ renderer });
    scene.add(spark);

    // Renderer smoke only. KHR_gaussian_splatting GLB -> Spark conversion is
    // intentionally kept separate and is the remaining part of issue #526.
    const splat = new SplatMesh({
      url: 'https://sparkjs.dev/assets/splats/butterfly.spz',
      onLoad() {
        status.textContent = 'Spark 2.1.0 / Three.js r180\nSPZ renderer smoke: OK';
      },
    });
    splat.position.set(0, 0, 0);
    scene.add(splat);

    splat.initialized.catch((error) => {
      console.error(error);
      status.textContent = `renderer smoke: FAILED\n${error?.message || error}`;
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
