<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SceneSync 3DGS Three.js Native Smoke</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111; color: #fff; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #status { position: fixed; top: 12px; left: 12px; z-index: 2; padding: 8px 10px; border-radius: 6px; background: rgba(0,0,0,.65); font-size: 13px; white-space: pre-line; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://rawcdn.githack.com/mrdoob/three.js/07abea59aa700eed861f23ede39eaf3d892c93a4/build/three.webgpu.js",
      "three/webgpu": "https://rawcdn.githack.com/mrdoob/three.js/07abea59aa700eed861f23ede39eaf3d892c93a4/build/three.webgpu.js",
      "three/tsl": "https://rawcdn.githack.com/mrdoob/three.js/07abea59aa700eed861f23ede39eaf3d892c93a4/build/three.tsl.js",
      "three/addons/": "https://rawcdn.githack.com/mrdoob/three.js/07abea59aa700eed861f23ede39eaf3d892c93a4/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="status">Three.js native KHR_gaussian_splatting\nloading…</div>
  <script type="module">
    import * as THREE from 'three/webgpu';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { GLTFGaussianSplatLoaderExtension } from 'three/addons/loaders/GLTFGaussianSplatLoaderExtension.js';

    const status = document.querySelector('#status');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 1000);
    camera.position.set(0, 0.25, 2.5);

    const params = new URLSearchParams(location.search);
    const forceWebGL = params.get('forceWebGL') === '1' || !navigator.gpu;

    // `minimal` is the hand-built 8 splat fixture; `ring` is a 16 splat scene
    // with degree 1 SH produced by the SceneSync PLY importer, so it also
    // exercises the higher order SH accessors.
    const FIXTURES = {
      minimal: './fixtures/minimal-khr-gaussian-splatting.glb',
      ring: './fixtures/ring-gaussian-splats.glb',
    };
    const fixtureName = FIXTURES[params.get('fixture')] ? params.get('fixture') : 'minimal';
    const renderer = new THREE.WebGPURenderer({ antialias: false, forceWebGL });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);
    await renderer.init();

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.2, 0);
    controls.enableDamping = true;

    const loader = new GLTFLoader();
    loader.register((parser) => new GLTFGaussianSplatLoaderExtension(parser));

    try {
      const gltf = await loader.loadAsync(FIXTURES[fixtureName]);
      const splats = [];
      gltf.scene.traverse((object) => {
        if (object.isGaussianSplatMesh) splats.push(object);
      });

      if (splats.length === 0) throw new Error('GaussianSplatMesh was not created');
      scene.add(gltf.scene);

      const splatCount = splats.reduce((sum, mesh) => {
        return sum + (mesh.splatGeometry?.getAttribute('position')?.count || 0);
      }, 0);

      status.textContent = [
        'KHR_gaussian_splatting GLB → Three.js native loader: OK',
        `fixture: ${fixtureName}`,
        `GaussianSplatMesh: ${splats.length}`,
        `splats: ${splatCount}`,
        `backend: ${forceWebGL ? 'WebGL fallback' : 'WebGPU'}`,
        'Three.js PR #33950 merge commit',
      ].join('\n');
    } catch (error) {
      console.error(error);
      status.textContent = `Three.js native KHR smoke: FAILED\n${error?.message || error}`;
    }

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
