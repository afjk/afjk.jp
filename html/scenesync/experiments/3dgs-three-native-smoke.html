<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SceneSync 3DGS Three.js Runtime Smoke</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111; color: #fff; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #status { position: fixed; top: 12px; left: 12px; z-index: 2; padding: 8px 10px; border-radius: 6px; background: rgba(0,0,0,.65); font-size: 13px; white-space: pre-line; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/gh/mrdoob/three.js@cbba126004263d0c32d3d6d05a4fe218d261fa47/build/three.webgpu.js",
      "three/webgpu": "https://cdn.jsdelivr.net/gh/mrdoob/three.js@cbba126004263d0c32d3d6d05a4fe218d261fa47/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/gh/mrdoob/three.js@cbba126004263d0c32d3d6d05a4fe218d261fa47/build/three.tsl.js",
      "three/addons/": "https://cdn.jsdelivr.net/gh/mrdoob/three.js@cbba126004263d0c32d3d6d05a4fe218d261fa47/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="status">Scene Sync Three.js KHR_gaussian_splatting\nloading…</div>
  <script type="module">
    import * as THREE from 'three/webgpu';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import {
      getSceneSyncGLTFLoaderExtensionDiagnostics,
      initializeSceneSyncGLTFLoaderExtensions,
      registerSceneSyncGLTFLoaderExtensions,
    } from '/assets/js/scenesync/loaders/gltf-loader-config.js';

    const status = document.querySelector('#status');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 1000);
    camera.position.set(0, 0.25, 2.5);

    const params = new URLSearchParams(location.search);
    const forceWebGL = params.get('webgpu') !== '1';

    // `minimal` is the hand-built 8 splat fixture; `ring` is a 16 splat scene
    // with degree 1 SH produced by the SceneSync PLY importer, so it also
    // exercises the higher order SH accessors.
    const FIXTURES = {
      minimal: './fixtures/minimal-khr-gaussian-splatting.glb',
      ring: './fixtures/ring-gaussian-splats.glb',
    };
    const fixtureName = FIXTURES[params.get('fixture')] ? params.get('fixture') : 'minimal';
    const renderer = new THREE.WebGPURenderer({ antialias: true, forceWebGL });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);
    await renderer.init();

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.2, 0);
    controls.enableDamping = true;

    const loader = new GLTFLoader();
    await initializeSceneSyncGLTFLoaderExtensions();
    await registerSceneSyncGLTFLoaderExtensions(loader);

    const normalMesh = new THREE.Mesh(
      new THREE.BoxGeometry(0.15, 0.15, 0.15),
      new THREE.MeshStandardMaterial({ color: 0x44aaff }),
    );
    normalMesh.position.set(-0.8, -0.5, 0);
    scene.add(normalMesh);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 2));

    try {
      const gltf = await loader.loadAsync(FIXTURES[fixtureName]);
      const splats = [];
      gltf.scene.traverse((object) => {
        if (object.isGaussianSplat) splats.push(object);
      });

      if (splats.length === 0) throw new Error('GaussianSplat was not created');
      scene.add(gltf.scene);

      const splatCount = splats.reduce((sum, mesh) => {
        return sum + (mesh.splatGeometry?.getAttribute('position')?.count || 0);
      }, 0);

      const backend = renderer.backend?.isWebGLBackend === true ? 'webgl' : 'webgpu';
      window.__gaussianSplatSmoke = {
        done: true,
        backend,
        renderer: 'WebGPURenderer',
        gaussianObjects: splats.length,
        splatCount,
        normalMeshes: 1,
        rendered: false,
        fixture: fixtureName,
        ...getSceneSyncGLTFLoaderExtensionDiagnostics(),
      };
      status.textContent = [
        'KHR_gaussian_splatting GLB → Scene Sync Three.js loader: OK',
        `fixture: ${fixtureName}`,
        `GaussianSplat: ${splats.length}`,
        `splats: ${splatCount}`,
        `backend: ${backend}`,
        `patch: ${getSceneSyncGLTFLoaderExtensionDiagnostics().gaussianSplatPatch}`,
        'Three.js @ cbba126004263d0c32d3d6d05a4fe218d261fa47',
      ].join('\n');
    } catch (error) {
      console.error(error);
      window.__gaussianSplatSmoke = {
        done: true,
        backend: renderer.backend?.isWebGLBackend === true ? 'webgl' : 'webgpu',
        renderer: 'WebGPURenderer',
        gaussianObjects: 0,
        splatCount: 0,
        normalMeshes: 1,
        rendered: false,
        error: error?.message || String(error),
      };
      status.textContent = `Scene Sync Three.js KHR smoke: FAILED\n${error?.message || error}`;
    }

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
      if (window.__gaussianSplatSmoke?.gaussianObjects > 0) {
        window.__gaussianSplatSmoke.rendered = true;
      }
    });
  </script>
</body>
</html>
