openapi: 3.1.0
info:
  title: Scene Sync GPT getSelection Action
  version: 0.1.0
servers:
  - url: https://afjk.jp/presence/api/gpt
paths:
  /room/{roomId}/ai-command:
    post:
      operationId: runAiCommandViaGptSession
      summary: Request a browser-local action from the linked Scene Sync browser
      description: Use action `getSelection` to retrieve the objects currently selected by the linked browser user.
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sessionId
                - action
              properties:
                sessionId:
                  type: string
                action:
                  type: string
                  enum:
                    - getSelection
                params:
                  type: object
                  description: Empty object for getSelection.
                  properties: {}
                  additionalProperties: false
            example:
              sessionId: SESSION_ID
              action: getSelection
              params: {}
      responses:
        '200':
          description: Current selection result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
