openapi: 3.1.0
info:
  title: Scene Sync AI Wrapper API
  version: 0.1.0
  description: |
    Provider-neutral wrapper API for Scene Sync. Any AI client can call these
    endpoints by passing the opaque `sessionId` in the request body.
    Stable AI-facing tool names are documented separately in
    `docs/scene-sync-ai-spec.md` and map to this HTTP surface without renaming.
servers:
  - url: https://afjk.jp/presence/api/ai
    description: Production
paths:
  /link/redeem:
    post:
      operationId: redeemAiLink
      summary: Redeem a 6-digit pairing code and create an AI session
      description: |
        Stable AI tool mapping: `scene_sync_redeem`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  pattern: '^\d{6}$'
      responses:
        '200':
          description: AI session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiRedeemResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '410':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalError'
  /link/revoke:
    post:
      operationId: revokeAiLink
      summary: Revoke an AI session and underlying Scene Sync link
      description: |
        Stable AI tool mapping: `scene_sync_revoke`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionOnlyRequest'
      responses:
        '200':
          description: Link revoked
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'
  /room/{roomId}/scene:
    post:
      operationId: getSceneViaAiSession
      summary: Get current scene state
      description: |
        Stable AI tool mapping: `scene_sync_get_scene`.
        Use this as the source of truth for before/after verification.
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionOnlyRequest'
      responses:
        '200':
          description: Scene snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneState'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
  /room/{roomId}/broadcast:
    post:
      operationId: broadcastSceneMutationViaAiSession
      summary: Apply a scene mutation
      description: |
        Stable AI tool mapping: `scene_sync_broadcast`.
        Use this for scene-add, scene-delta, scene-remove, scene-env, and scene-batch.
        When creating a primitive object such as a box, always include `payload.asset`
        with `type`, `primitive`, and `color`.
        Verify with `/room/{roomId}/scene` after create/update/delete when
        object correctness matters.
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, payload]
              properties:
                sessionId:
                  type: string
                payload:
                  description: |
                    Scene mutation payload. For `scene-add` of a primitive object, do not omit
                    `asset`. A cube without `asset` may be created without the intended appearance.
                  oneOf:
                    - $ref: '#/components/schemas/SceneAddPayload'
                    - $ref: '#/components/schemas/SceneDeltaPayload'
                    - $ref: '#/components/schemas/SceneRemovePayload'
                    - $ref: '#/components/schemas/SceneEnvPayload'
                    - $ref: '#/components/schemas/SceneBatchPayload'
              example:
                sessionId: v1.example
                payload:
                  kind: scene-add
                  objectId: ai-cube-1
                  name: Orange Cube
                  position: [0, 0.5, 0]
                  rotation: [0, 0, 0, 1]
                  scale: [1, 1, 1]
                  asset:
                    type: primitive
                    primitive: box
                    color: '#ff8800'
      responses:
        '200':
          description: Broadcast result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalError'
  /room/{roomId}/ai-command:
    post:
      operationId: runAiCommandViaAiSession
      summary: Request a browser-only action from the linked peer
      description: |
        Stable AI tool mapping: `scene_sync_ai_command`.
        Browser-side action: selection, camera, focus, undo/redo, screenshots, imports, replace, skybox, animation.
        For accuracy, confirm URL imports with `/room/{roomId}/scene`.
      parameters:
        - in: path
          name: roomId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, action]
              properties:
                sessionId:
                  type: string
                requestId:
                  type: string
                action:
                  type: string
                  enum:
                    - getSelection
                    - getCameraPose
                    - focusObject
                    - undo
                    - redo
                    - getHistory
                    - screenshot
                    - uploadGlbFromUrl
                    - addImageFromUrl
                    - addVideoFromUrl
                    - addTextFromUrl
                    - replaceMediaFromUrl
                    - replaceTextContent
                    - setSkyboxFromImageUrl
                    - setAnimationClip
                params:
                  description: |
                    Parameters depend on `action`. For `getSelection`, send `{}`.
                    For `focusObject`, send `{ "objectId": "<target object id>" }`.
                    For URL-based
                    imports and skybox changes, send at least
                    `{ "url": "https://..." }`.
                  oneOf:
                    - $ref: '#/components/schemas/GetSelectionParams'
                    - $ref: '#/components/schemas/GetCameraPoseParams'
                    - $ref: '#/components/schemas/FocusObjectParams'
                    - $ref: '#/components/schemas/UndoRedoParams'
                    - $ref: '#/components/schemas/GetHistoryParams'
                    - $ref: '#/components/schemas/ScreenshotParams'
                    - $ref: '#/components/schemas/UploadGlbFromUrlParams'
                    - $ref: '#/components/schemas/UrlImportParams'
                    - $ref: '#/components/schemas/ReplaceMediaFromUrlParams'
                    - $ref: '#/components/schemas/ReplaceTextContentParams'
                    - $ref: '#/components/schemas/SetSkyboxFromImageUrlParams'
                    - $ref: '#/components/schemas/SetAnimationClipParams'
                targetPeerId:
                  type: string
            examples:
              getSelection:
                summary: Get currently selected objects in the linked browser
                value:
                  sessionId: v1.example
                  action: getSelection
                  params: {}
              focusObject:
                summary: Focus the camera on ai-cube-1
                value:
                  sessionId: v1.example
                  action: focusObject
                  params:
                    objectId: ai-cube-1
              getCameraPose:
                summary: Read the current camera pose
                value:
                  sessionId: v1.example
                  action: getCameraPose
                  params: {}
              uploadGlbFromUrl:
                summary: Import a GLB from a URL
                value:
                  sessionId: v1.example
                  action: uploadGlbFromUrl
                  params:
                    url: https://example.com/model.glb
                    objectId: web-demo-1
                    position: [0, 0.5, 0]
              addImageFromUrl:
                summary: Add an image panel from a URL
                value:
                  sessionId: v1.example
                  action: addImageFromUrl
                  params:
                    url: https://example.com/reference.jpg
                    objectId: ref-image-1
                    position: [0, 1.2, -1.5]
              replaceMediaFromUrl:
                summary: Replace selected media
                value:
                  sessionId: v1.example
                  action: replaceMediaFromUrl
                  params:
                    url: https://example.com/replacement.jpg
                    mediaType: image
              replaceTextContent:
                summary: Replace selected text
                value:
                  sessionId: v1.example
                  action: replaceTextContent
                  params:
                    text: Hello Scene Sync
                    fontSize: 32
                    align: center
              setSkyboxFromImageUrl:
                summary: Replace the skybox from an image URL
                value:
                  sessionId: v1.example
                  action: setSkyboxFromImageUrl
                  params:
                    url: https://example.com/panorama.jpg
              setAnimationClip:
                summary: Set an animated GLB object to the laugh clip
                value:
                  sessionId: v1.example
                  action: setAnimationClip
                  params:
                    objectId: minotauros-001
                    clipName: laugh
                    mode: loop
      responses:
        '200':
          description: AI command result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiCommandResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  responses:
    ValidationError:
      description: Missing or malformed request parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            error:
              code: validation_error
              message: focusObject requires params.objectId
              retryable: false
    UnauthorizedError:
      description: Session is invalid, expired, or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            error:
              code: unauthorized
              message: session expired
              retryable: false
    ForbiddenError:
      description: Session does not match the requested room or target.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            error:
              code: forbidden
              message: session does not match room
              retryable: false
    NotFoundError:
      description: The requested room, object, code, or target peer was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            error:
              code: not_found
              message: object not found
              retryable: false
    ConflictError:
      description: The request conflicts with current state or a stale token/code.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            error:
              code: conflict
              message: pairing code already redeemed
              retryable: true
    InternalError:
      description: Unexpected wrapper or browser-side failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            error:
              code: internal_error
              message: unexpected internal error
              retryable: true
  schemas:
    SessionOnlyRequest:
      type: object
      required: [sessionId]
      properties:
        sessionId:
          type: string
          description: Opaque session token `v1.<base64url(iv|ciphertext|tag)>`
    AiRedeemResponse:
      type: object
      required: [ok, sessionId, roomId, expiresAt]
      properties:
        ok:
          type: boolean
        sessionId:
          type: string
        roomId:
          type: string
        expiresAt:
          type: integer
    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
              enum:
                - validation_error
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - internal_error
            message:
              type: string
            retryable:
              type: boolean
    BroadcastResponse:
      type: object
      required: [ok, room, peers, userPresent]
      properties:
        ok:
          type: boolean
        room:
          type: string
        peers:
          type: integer
        userPresent:
          type: boolean
    AiCommandResponse:
      type: object
      required: [ok, room, peers, userPresent, targetPeerId, result]
      properties:
        ok:
          type: boolean
        room:
          type: string
        peers:
          type: integer
        userPresent:
          type: boolean
        targetPeerId:
          type: string
        result:
          $ref: '#/components/schemas/AiResultPayload'
    AiResultPayload:
      type: object
      required: [kind, ok]
      properties:
        kind:
          type: string
          const: ai-result
        requestId:
          type: string
        ok:
          type: boolean
        error:
          type: string
      additionalProperties: true
    GetSelectionParams:
      type: object
      description: No parameters. Returns the currently selected Scene Sync objects in the linked browser.
      properties: {}
      additionalProperties: false
      example: {}
    GetCameraPoseParams:
      type: object
      description: No parameters.
      properties: {}
      additionalProperties: false
      example: {}
    FocusObjectParams:
      type: object
      required: [objectId]
      additionalProperties: false
      properties:
        objectId:
          type: string
          description: Existing scene object id to focus the camera on.
      example:
        objectId: ai-cube-1
    UndoRedoParams:
      type: object
      description: No parameters.
      properties: {}
      additionalProperties: false
      example: {}
    GetHistoryParams:
      type: object
      additionalProperties: false
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 100
          description: Number of recent history entries to return.
      example:
        count: 10
    ScreenshotParams:
      type: object
      description: Optional parameters for screenshot. For MCP clients, mode="image" returns image content by default. For GPT Actions, use mode="url". Default 768px width optimized for WebSocket safety.
      properties:
        mode:
          type: string
          enum: [image, url]
          description: Return mode. "image" returns base64 image content (MCP). "url" uploads to temporary blob and returns URL.
        maxWidth:
          type: integer
          minimum: 128
          maximum: 2048
          description: Maximum image width for image mode. Default 768. Can specify up to 2048 for higher quality.
        quality:
          type: number
          minimum: 0.1
          maximum: 1
          description: JPEG quality. Default 0.7 for image mode.
      additionalProperties: false
      example: { "mode": "image", "maxWidth": 768, "quality": 0.7 }
    UploadGlbFromUrlParams:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        objectId:
          type: string
        name:
          type: string
        position:
          $ref: '#/components/schemas/Vec3'
        rotation:
          $ref: '#/components/schemas/Quat'
        scale:
          $ref: '#/components/schemas/Vec3'
      example:
        url: https://example.com/model.glb
        objectId: web-demo-1
        position: [0, 0.5, 0]
    UrlImportParams:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        objectId:
          type: string
        name:
          type: string
        position:
          $ref: '#/components/schemas/Vec3'
        rotation:
          $ref: '#/components/schemas/Quat'
        scale:
          $ref: '#/components/schemas/Vec3'
        projection:
          type: string
          enum: [flat, vr180]
          description: >
            Stereo projection for addImageFromUrl / addVideoFromUrl.
            `vr180` renders a half-dome. Omit to auto-detect from the filename.
        stereoLayout:
          type: string
          enum: [mono, sbs, tb]
          description: >
            Stereo eye layout for addImageFromUrl / addVideoFromUrl.
            `sbs` = side-by-side (left eye left), `tb` = top-bottom (left eye top).
            Omit to auto-detect from the filename.
      example:
        url: https://example.com/reference.jpg
        objectId: ref-image-1
        position: [0, 1.2, -1.5]
    SetSkyboxFromImageUrlParams:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
      example:
        url: https://example.com/panorama.jpg
    SetAnimationClipParams:
      type: object
      additionalProperties: false
      properties:
        objectId:
          type: string
          description: Existing animated GLB object id. Prefer passing this explicitly.
        clip:
          type: integer
          minimum: 0
          description: Animation clip index. Takes priority over clipName.
        clipName:
          type: string
          description: Animation clip name, such as idle, laugh, talk, or attack_1.
        name:
          type: string
          description: Alias for clipName.
        mode:
          type: string
          enum: [loop, once]
          default: loop
        speed:
          type: number
          minimum: 0
          default: 1
        enabled:
          type: boolean
          default: true
      anyOf:
        - required: [clip]
        - required: [clipName]
        - required: [name]
      example:
        objectId: minotauros-001
        clipName: laugh
        mode: loop
    ReplaceMediaFromUrlParams:
      type: object
      required: [url, mediaType]
      additionalProperties: false
      properties:
        objectId:
          type: string
          description: Existing media panel id. If omitted, the current browser selection is used.
        url:
          type: string
          format: uri
          description: Browser-accessible image or video URL.
        mediaType:
          type: string
          enum: [image, video]
          description: Replacement media type.
        name:
          type: string
          description: Optional object name.
      example:
        objectId: media-panel-1
        url: https://example.com/replacement.jpg
        mediaType: image
        name: Updated Image
    ReplaceTextContentParams:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        objectId:
          type: string
          description: Existing text panel id. If omitted, the current browser selection is used.
        text:
          type: string
          description: Replacement text content.
        name:
          type: string
          description: Optional object name.
        fontFamily:
          type: string
          enum: [system-sans, serif, monospace, japanese-sans, japanese-serif]
          description: Text font family.
        fontSize:
          type: number
          minimum: 1
          description: Font size in pixels.
        fontWeight:
          type: string
          description: CSS font weight.
        fontStyle:
          type: string
          enum: [normal, italic]
          description: Text font style.
        color:
          type: string
          description: Text color, such as #ffffff.
        backgroundColor:
          type: string
          description: Background color, such as #000000.
        align:
          type: string
          enum: [left, center, right]
          description: Text alignment.
      example:
        objectId: text-panel-1
        text: Hello Scene Sync
        fontFamily: system-sans
        fontSize: 32
        color: '#ffffff'
        align: center
    SceneState:
      type: object
      properties:
        envId:
          type: string
        objects:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
    SceneAddPayload:
      type: object
      description: |
        Adds a new object to the scene. If you are creating a primitive object,
        include `asset` and set `asset.type=primitive`, `asset.primitive`, and `asset.color`.
        Do not rely on `name` alone to describe the appearance.
      required: [kind, objectId]
      properties:
        kind:
          type: string
          const: scene-add
        objectId:
          type: string
          description: Stable object identifier chosen by the caller.
        name:
          type: string
          description: Human-readable label. This does not define appearance.
        position:
          $ref: '#/components/schemas/Vec3'
        rotation:
          $ref: '#/components/schemas/Quat'
        scale:
          $ref: '#/components/schemas/Vec3'
        asset:
          description: |
            Required when adding a primitive object. Example:
            `{ "type": "primitive", "primitive": "box", "color": "#ff8800" }`
          oneOf:
            - $ref: '#/components/schemas/PrimitiveAsset'
            - $ref: '#/components/schemas/GenericAsset'
        meshPath:
          type: string
        onBehalfOf:
          type: string
      example:
        kind: scene-add
        objectId: ai-cube-1
        name: Orange Cube
        position: [0, 0.5, 0]
        rotation: [0, 0, 0, 1]
        scale: [1, 1, 1]
        asset:
          type: primitive
          primitive: box
          color: '#ff8800'
    SceneDeltaPayload:
      type: object
      required: [kind, objectId]
      properties:
        kind:
          type: string
          const: scene-delta
        objectId:
          type: string
        name:
          type: string
        position:
          $ref: '#/components/schemas/Vec3'
        rotation:
          $ref: '#/components/schemas/Quat'
        scale:
          $ref: '#/components/schemas/Vec3'
        asset:
          oneOf:
            - $ref: '#/components/schemas/PrimitiveAsset'
            - $ref: '#/components/schemas/GenericAsset'
        meshPath:
          type: string
        onBehalfOf:
          type: string
    SceneRemovePayload:
      type: object
      required: [kind, objectId]
      properties:
        kind:
          type: string
          const: scene-remove
        objectId:
          type: string
        onBehalfOf:
          type: string
    SceneEnvPayload:
      type: object
      required: [kind, envId]
      properties:
        kind:
          type: string
          const: scene-env
        envId:
          type: string
        onBehalfOf:
          type: string
    SceneBatchPayload:
      type: object
      required: [kind, ops]
      properties:
        kind:
          type: string
          const: scene-batch
        ops:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/SceneAddPayload'
              - $ref: '#/components/schemas/SceneDeltaPayload'
              - $ref: '#/components/schemas/SceneRemovePayload'
              - $ref: '#/components/schemas/SceneEnvPayload'
        onBehalfOf:
          type: string
      example:
        kind: scene-batch
        ops:
          - kind: scene-add
            objectId: ai-cube-1
            name: Orange Cube
            position: [0, 0.5, 0]
            rotation: [0, 0, 0, 1]
            scale: [1, 1, 1]
            asset:
              type: primitive
              primitive: box
              color: '#ff8800'
    PrimitiveAsset:
      type: object
      required: [type, primitive]
      properties:
        type:
          type: string
          const: primitive
        primitive:
          type: string
          description: Primitive mesh type such as box, sphere, cylinder, or plane.
          enum: [box, sphere, cylinder, plane]
        color:
          type: string
          description: Hex color for the primitive, for example `#ff8800`.
      example:
        type: primitive
        primitive: box
        color: '#ff8800'
    GenericAsset:
      type: object
      description: Non-primitive asset payload used by custom meshes or future asset types.
      properties: {}
      additionalProperties: true
    Vec3:
      type: array
      minItems: 3
      maxItems: 3
      items:
        type: number
    Quat:
      type: array
      minItems: 4
      maxItems: 4
      items:
        type: number
